[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incidentweaver-ai-runtime"
version = "0.1.0"
description = "IncidentWeaver AI runtime bootstrap"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-ai-slim[openai,mcp]==0.8.0",
    "psycopg[binary]>=3.2,<4.0",
    "opentelemetry-api>=1.28,<1.44",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<10.0",
    "pyright>=1.1.396,<2.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "agent.py", "model_provider.py", "text_safety.py", "embedding.py", "retrieval.py", "index_knowledge.py"]

[tool.pytest.ini_options]
pythonpath = [".", "../../tests/ai-runtime"]
testpaths = ["../../tests/ai-runtime"]