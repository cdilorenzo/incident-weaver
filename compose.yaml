services:
  control-plane:
    build:
      context: .
      dockerfile: src/control-plane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AiRuntime__Url: http://ai-runtime:8000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  ai-runtime:
    build:
      context: .
      dockerfile: src/ai-runtime/Dockerfile

  ops-mcp:
    build:
      context: .
      dockerfile: src/ops-mcp/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
