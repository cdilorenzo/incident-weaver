services:
  control-plane:
    build:
      context: .
      dockerfile: src/control-plane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AiRuntime__Url: http://ai-runtime:8000
      WriteMcp__Url: http://ops-mcp-write:8002
    networks:
      - control-ai
      - control-write
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  ai-runtime:
    build:
      context: .
      dockerfile: src/ai-runtime/Dockerfile
    environment:
      INCIDENTWEAVER_OPS_MCP_URL: http://ops-mcp:8001/mcp
      INCIDENTWEAVER_KNOWLEDGE_DSN: postgresql://incidentweaver_ai:${INCIDENTWEAVER_KNOWLEDGE_DB_PASSWORD:?Set%20INCIDENTWEAVER_KNOWLEDGE_DB_PASSWORD}@knowledge-db:5432/incidentweaver_ai
    depends_on:
      knowledge-db:
        condition: service_healthy
    networks:
      - control-ai
      - ai-read

  ops-mcp:
    build:
      context: .
      dockerfile: src/ops-mcp/Dockerfile
    networks:
      - ai-read
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  ops-mcp-write:
    build:
      context: .
      dockerfile: src/ops-mcp/Dockerfile
    command: ["python", "write_server.py"]
    networks:
      - control-write
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  knowledge-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: incidentweaver_ai
      POSTGRES_USER: incidentweaver_ai
      POSTGRES_PASSWORD: ${INCIDENTWEAVER_KNOWLEDGE_DB_PASSWORD:?Set%20INCIDENTWEAVER_KNOWLEDGE_DB_PASSWORD}
    networks:
      - ai-read
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentweaver_ai -d incidentweaver_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  control-ai:
  ai-read:
  control-write:
